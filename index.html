<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <h1>Todo App</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="What needs doing?">
      <button id="addBtn">Add</button>
    </div>
    <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>

    <div class="filter-group">
      <button id="filterAll" class="filter-btn active">All</button>
      <button id="filterActive" class="filter-btn">Active</button>
      <button id="filterCompleted" class="filter-btn">Completed</button>
    </div>

    <ul id="todoList" class="todo-list"></ul>

    <div class="footer">
      <span id="itemsCount">0 items left</span>
      <div class="action-btns">
        <button id="clearCompletedBtn">Clear completed</button>
        <button id="clearAllBtn">Clear all</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
